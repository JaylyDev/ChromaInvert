[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chromainvert"
version = "0.2.0"
description = "Perceptual video and LUT reverse-engineering engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE*"]
authors = [{ name = "ChromaInvert contributors" }]
keywords = ["color-grading", "lut", "colour-science", "pytorch", "ffmpeg"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = ["numpy>=1.26", "torch>=2.0", "imageio>=2.30"]

[project.scripts]
chromainvert = "chromainvert.cli:main"

[project.optional-dependencies]
torch = ["torch>=2.0"]
video = ["imageio>=2.30"]
dev = ["chromainvert[torch,video]", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/JaylyDev/ChromaInvert"
Repository = "https://github.com/JaylyDev/ChromaInvert"
Issues = "https://github.com/JaylyDev/ChromaInvert/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
