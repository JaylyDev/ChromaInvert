name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/gui/package-lock.json
      - name: Install GUI deps
        run: npm ci
      - name: Typecheck GUI
        run: npm run typecheck
      - name: Build GUI
        run: npm run build
      - name: Package GUI
        run: npm run dist
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: chromainvert-${{ matrix.os }}
          path: app/gui/release/*

