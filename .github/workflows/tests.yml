name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        run: python -m pip install --upgrade pip && python -m pip install -e "./engine[dev]"
      - name: Run engine tests
        run: python -m pytest engine/tests -q
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure app
        run: cmake -B build -S app -A x64
      - name: Build app
        run: cmake --build build --config Release
